name: Admin Hardening CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/admin-hardening-ci.yml"
      - ".github/workflows/harden-staging.yml"
      - "docs/phase2-cloudflare-admin-hardening-plan.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/cloudflare-admin-audit.mjs"
      - "scripts/cloudflare-ai-gateway-configure.mjs"
      - "scripts/scan-added-lines-for-secrets.mjs"
      - "test/admin-hardening/**"

permissions:
  contents: read

concurrency:
  group: admin-hardening-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admin-hardening:
    name: admin-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install root dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/cloudflare-admin-audit.mjs
          node --check scripts/cloudflare-ai-gateway-configure.mjs
          node --check scripts/scan-added-lines-for-secrets.mjs
          node --check test/admin-hardening/mock-cloudflare-fetch.mjs
          node --check test/admin-hardening/admin-hardening.test.mjs

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "psych"; ARGV.each { |path| Psych.parse_file(path); puts "YAML OK: #{path}" }' \
            .github/workflows/admin-hardening-ci.yml \
            .github/workflows/harden-staging.yml

      - name: Run reproducible admin-hardening mocks
        run: npm run test:admin-hardening

      - name: Run Worker checks and staging dry-run
        run: |
          npm run audit:security
          npm run check
          npm run dry-run:staging

      - name: Run Monitoring Agent checks
        run: |
          npm ci --prefix monitoring-agent
          npm audit --audit-level=high --prefix monitoring-agent
          npm run check --prefix monitoring-agent

      - name: Validate diff and scan added lines for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${HEAD_SHA}"
          git diff --no-ext-diff --unified=0 "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr.diff
          node scripts/scan-added-lines-for-secrets.mjs /tmp/pr.diff
