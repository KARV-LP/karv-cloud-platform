name: Refresh Worker types

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-types:
    if: github.head_ref == 'agent/staging-security-controls' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Worker types
        run: npm run types:generate
      - name: Commit generated types
        shell: bash
        run: |
          if git diff --quiet -- worker-configuration.d.ts; then
            echo "worker-configuration.d.ts already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-configuration.d.ts
          git commit -m "Atualiza tipos gerados da Fase 2 [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
