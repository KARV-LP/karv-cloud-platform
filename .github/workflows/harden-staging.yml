name: Harden Cloudflare staging (admin controls)

# Fase 2 (issue #18) — controles administrativos do staging Cloudflare.
# Sem Terraform: escopo pequeno, resolvido diretamente via API Cloudflare e
# Wrangler. Este workflow nunca toca em produção e nunca habilita
# AI_API_ENABLED, REPORTING_API_ENABLED ou REPORT_DELIVERY_ENABLED — nenhuma
# chamada aqui referencia o ambiente production nem o Worker de produção.
#
# Controles ainda registrados como bloqueio administrativo, não implementados
# aqui (ver docs/phase2-cloudflare-admin-hardening-plan.md): Cloudflare Access
# e destinatário do alerta de custo. Rate limit, ZDR e spend limit do AI
# Gateway staging são implementados e validados de fato.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type HARDEN-STAGING to confirm this administrative hardening run
        required: true
        type: string
      ai_gateway_rate_limit_requests:
        description: "Decisão B — número de requisições permitidas na janela do AI Gateway staging"
        required: true
        type: string
      ai_gateway_rate_limit_period_seconds:
        description: "Decisão B — duração da janela, em segundos"
        required: true
        type: string
      ai_gateway_spend_limit_amount:
        description: "Decisão C — valor do spend limit do AI Gateway staging (USD). Deixe em branco para não alterar o spend limit nesta execução."
        required: false
        type: string
      ai_gateway_spend_limit_period:
        description: "Decisão C — período do spend limit. Obrigatório se o valor acima for informado."
        required: false
        type: choice
        options:
          - ""
          - daily
          - weekly
          - monthly

permissions:
  contents: read

concurrency:
  group: harden-cloudflare-staging
  cancel-in-progress: false

jobs:
  plan:
    name: Audit (somente leitura, sem apply)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Verify explicit hardening confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: test "$CONFIRMATION" = "HARDEN-STAGING"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require CLOUDFLARE_ADMIN_API_TOKEN
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
        shell: bash
        run: test -n "$TOKEN" || { echo "secrets.CLOUDFLARE_ADMIN_API_TOKEN ausente no Environment staging." >&2; exit 1; }

      - name: Require CLOUDFLARE_ACCOUNT_ID
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: test -n "$ACCOUNT_ID" || { echo "vars.CLOUDFLARE_ACCOUNT_ID ausente no Environment staging." >&2; exit 1; }

      - name: Confirm critical feature flags remain disabled
        shell: bash
        run: |
          for flag in AI_API_ENABLED REPORTING_API_ENABLED REPORT_DELIVERY_ENABLED; do
            if grep -q "\"$flag\": \"true\"" wrangler.jsonc; then
              echo "Refusing to proceed: $flag is true in wrangler.jsonc" >&2
              exit 1
            fi
          done

      - name: Validate numeric and spend-limit inputs
        env:
          RATE_REQUESTS: ${{ inputs.ai_gateway_rate_limit_requests }}
          RATE_PERIOD: ${{ inputs.ai_gateway_rate_limit_period_seconds }}
          SPEND_AMOUNT: ${{ inputs.ai_gateway_spend_limit_amount }}
          SPEND_PERIOD: ${{ inputs.ai_gateway_spend_limit_period }}
        shell: bash
        run: |
          case "$RATE_REQUESTS" in ''|*[!0-9]*) echo "ai_gateway_rate_limit_requests deve ser um inteiro positivo." >&2; exit 1;; esac
          [ "$RATE_REQUESTS" -gt 0 ] || { echo "ai_gateway_rate_limit_requests deve ser maior que zero." >&2; exit 1; }
          case "$RATE_PERIOD" in ''|*[!0-9]*) echo "ai_gateway_rate_limit_period_seconds deve ser um inteiro positivo." >&2; exit 1;; esac
          [ "$RATE_PERIOD" -gt 0 ] || { echo "ai_gateway_rate_limit_period_seconds deve ser maior que zero." >&2; exit 1; }

          if [ -n "$SPEND_AMOUNT" ] || [ -n "$SPEND_PERIOD" ]; then
            [ -n "$SPEND_AMOUNT" ] || { echo "ai_gateway_spend_limit_amount é obrigatório quando ai_gateway_spend_limit_period é informado." >&2; exit 1; }
            [ -n "$SPEND_PERIOD" ] || { echo "ai_gateway_spend_limit_period é obrigatório quando ai_gateway_spend_limit_amount é informado." >&2; exit 1; }
            case "$SPEND_AMOUNT" in ''|*[!0-9.]*) echo "ai_gateway_spend_limit_amount deve ser numérico." >&2; exit 1;; esac
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pre-apply audit — estado atual e alteração proposta (sem mutação)
        env:
          AUDIT_MODE: pre
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROPOSED_RATE_LIMIT_REQUESTS: ${{ inputs.ai_gateway_rate_limit_requests }}
          PROPOSED_RATE_LIMIT_PERIOD_SECONDS: ${{ inputs.ai_gateway_rate_limit_period_seconds }}
          PROPOSED_SPEND_LIMIT_AMOUNT: ${{ inputs.ai_gateway_spend_limit_amount }}
          PROPOSED_SPEND_LIMIT_PERIOD: ${{ inputs.ai_gateway_spend_limit_period }}
        shell: bash
        run: |
          {
            echo "## Auditoria pré-apply (staging admin hardening, sanitizada)"
            echo '```'
            node scripts/cloudflare-admin-audit.mjs
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (requer aprovação humana separada)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Este Environment deve ter "required reviewers" configurado em
    # Settings → Environments → staging-admin-hardening-apply, com secrets
    # próprios (CLOUDFLARE_ADMIN_API_TOKEN, KARV_INTERNAL_API_TOKEN) e
    # variables próprias (CLOUDFLARE_ACCOUNT_ID, STAGING_HEALTH_URL). Nada é
    # herdado por presunção do Environment "staging".
    environment: staging-admin-hardening-apply
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require CLOUDFLARE_ADMIN_API_TOKEN
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
        shell: bash
        run: test -n "$TOKEN" || { echo "secrets.CLOUDFLARE_ADMIN_API_TOKEN ausente no Environment staging-admin-hardening-apply." >&2; exit 1; }

      - name: Require KARV_INTERNAL_API_TOKEN
        env:
          TOKEN: ${{ secrets.KARV_INTERNAL_API_TOKEN }}
        shell: bash
        run: test -n "$TOKEN" || { echo "secrets.KARV_INTERNAL_API_TOKEN ausente no Environment staging-admin-hardening-apply." >&2; exit 1; }

      - name: Require CLOUDFLARE_ACCOUNT_ID
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: test -n "$ACCOUNT_ID" || { echo "vars.CLOUDFLARE_ACCOUNT_ID ausente no Environment staging-admin-hardening-apply." >&2; exit 1; }

      - name: Require STAGING_HEALTH_URL
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        shell: bash
        run: test -n "$HEALTH_URL" || { echo "vars.STAGING_HEALTH_URL ausente no Environment staging-admin-hardening-apply." >&2; exit 1; }

      - name: Confirm critical feature flags remain disabled
        shell: bash
        run: |
          for flag in AI_API_ENABLED REPORTING_API_ENABLED REPORT_DELIVERY_ENABLED; do
            if grep -q "\"$flag\": \"true\"" wrangler.jsonc; then
              echo "Refusing to proceed: $flag is true in wrangler.jsonc" >&2
              exit 1
            fi
          done

      - name: Set KARV_INTERNAL_API_TOKEN secret on the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KARV_INTERNAL_API_TOKEN: ${{ secrets.KARV_INTERNAL_API_TOKEN }}
        shell: bash
        run: printf '%s' "$KARV_INTERNAL_API_TOKEN" | npx wrangler secret put KARV_INTERNAL_API_TOKEN --env staging

      - name: Configure AI Gateway staging (rate limit, ZDR, spend limit)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AI_GATEWAY_RATE_LIMIT_REQUESTS: ${{ inputs.ai_gateway_rate_limit_requests }}
          AI_GATEWAY_RATE_LIMIT_PERIOD_SECONDS: ${{ inputs.ai_gateway_rate_limit_period_seconds }}
          AI_GATEWAY_SPEND_LIMIT_AMOUNT: ${{ inputs.ai_gateway_spend_limit_amount }}
          AI_GATEWAY_SPEND_LIMIT_PERIOD: ${{ inputs.ai_gateway_spend_limit_period }}
        run: node scripts/cloudflare-ai-gateway-configure.mjs

      - name: Post-apply audit (estrita — falha se algo não foi confirmado)
        env:
          AUDIT_MODE: post
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_RATE_LIMIT_REQUESTS: ${{ inputs.ai_gateway_rate_limit_requests }}
          EXPECTED_RATE_LIMIT_PERIOD_SECONDS: ${{ inputs.ai_gateway_rate_limit_period_seconds }}
          EXPECTED_SPEND_LIMIT_AMOUNT: ${{ inputs.ai_gateway_spend_limit_amount }}
          EXPECTED_SPEND_LIMIT_PERIOD: ${{ inputs.ai_gateway_spend_limit_period }}
        shell: bash
        run: |
          {
            echo "## Auditoria pós-apply (staging admin hardening, sanitizada)"
            echo '```'
            node scripts/cloudflare-admin-audit.mjs
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remote health check on staging
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_HEALTH_URL")
          test "$status" = "200" || { echo "Health check falhou com status $status" >&2; exit 1; }

      - name: Confirm production and feature flags untouched
        shell: bash
        run: |
          for flag in AI_API_ENABLED REPORTING_API_ENABLED REPORT_DELIVERY_ENABLED; do
            if grep -q "\"$flag\": \"true\"" wrangler.jsonc; then
              echo "$flag is true after apply — this should never happen." >&2
              exit 1
            fi
          done
          echo "Nenhuma chamada deste job referenciou o Worker de produção (karv-cloud-platform) ou o env.production do wrangler.jsonc."
