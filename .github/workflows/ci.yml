name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  validate-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: monitoring-agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monitoring-agent/package-lock.json
      - run: npm ci
      - run: npm run check

  stage6-deploy-and-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/stage6-post-automation-validation'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Register validation start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" \
            -f body="Etapa 6 iniciada automaticamente pelo CI existente. Execução: ${RUN_URL}"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix monitoring-agent
      - run: npm run check --prefix monitoring-agent
      - run: npm run dry-run:staging

      - name: Deploy the disabled-by-default staging Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          wranglerVersion: "4.118.0"

      - name: Run automated staging smoke tests
        id: smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run test:smoke

      - name: Register validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          body=$(printf '## Resultado da Etapa 6\n\n- Job: `%s`\n- Deploy staging: `%s`\n- Smoke tests: `%s`\n- URL de staging: `%s`\n- Execução: %s' \
            "$JOB_STATUS" "$DEPLOY_OUTCOME" "$SMOKE_OUTCOME" "${DEPLOYMENT_URL:-não disponível}" "$RUN_URL")
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
