name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  validate-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: monitoring-agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monitoring-agent/package-lock.json
      - run: npm ci
      - run: npm run check

  stage6-deploy-and-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/stage6-post-automation-validation'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix monitoring-agent
      - run: npm run check --prefix monitoring-agent
      - run: npm run dry-run:staging

      - name: Deploy the disabled-by-default staging Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          wranglerVersion: "4.118.0"

      - name: Run automated staging smoke tests
        id: smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run test:smoke
