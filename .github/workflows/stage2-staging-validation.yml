name: Stage 2 staging validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-and-validate:
    if: github.head_ref == 'ops/staging-security-validation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Audit root dependencies
        run: npm run audit:security
      - name: Validate Worker
        run: npm run check
      - name: Install Monitoring Agent dependencies
        run: npm ci --prefix monitoring-agent
      - name: Audit Monitoring Agent dependencies
        run: npm audit --audit-level=high --prefix monitoring-agent
      - name: Validate Monitoring Agent
        run: npm run check --prefix monitoring-agent
      - name: Dry-run staging
        run: npm run dry-run:staging
      - name: Deploy staging security controls
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          wranglerVersion: 4.118.0
      - name: Run standard staging smoke tests
        env:
          SMOKE_BASE_URL: https://karv-cloud-platform-staging.comercial-karv-sp.workers.dev
        run: npm run test:smoke
      - name: Validate Stage 2 remote security contracts
        env:
          STAGING_BASE_URL: https://karv-cloud-platform-staging.comercial-karv-sp.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.STAGING_BASE_URL;
          const preflight = await fetch(`${base}/api/internal/ai`, {
            method: "OPTIONS",
            headers: {
              Origin: "https://www.k-arv.com",
              "Access-Control-Request-Method": "POST"
            }
          });
          if (preflight.status !== 403) {
            throw new Error(`Expected unauthorized browser preflight HTTP 403, received ${preflight.status}`);
          }
          if (preflight.headers.has("access-control-allow-origin")) {
            throw new Error("Unauthorized origin received Access-Control-Allow-Origin");
          }

          const report = await fetch(`${base}/api/internal/reports/summary`);
          if (report.status !== 503) {
            throw new Error(`Expected reporting API HTTP 503, received ${report.status}`);
          }

          console.log("PASS: unauthorized browser origin denied without CORS headers");
          console.log("PASS: reporting API remained disabled with HTTP 503");
          NODE
